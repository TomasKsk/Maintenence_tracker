<!DOCTYPE html>

<html>
  <body>

    <h1>Add city</h1>

    <form
      id="cityForm"
    >

      <input
        name="name"
        placeholder="City"
        required
      />

      <input
        name="country"
        placeholder="Country"
        required
      />

      <button type="submit" id="citySubmitButton">
        Add city
      </button>

    </form>

    <section>
      Select from cities:
      <select name="" id="customerCity">
        <option value="">Select City</option>
      </select>

    </section>

    <script src="client.js"></script>
  </body>
</html>
