<!DOCTYPE html>

<html>
  <body>

    <h1>Add city</h1>

    <form
      action="/api/cities"
      method="POST"
    >

      <input
        name="name"
        placeholder="City"
        required
      />

      <input
        name="country"
        placeholder="Country"
        required
      />

      <button type="submit">
        Add city
      </button>

    </form>

  </body>
</html>
