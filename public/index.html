<!DOCTYPE html>

<html>
  <body>

    <h1>Add city</h1>

    <form
      id="cityForm"
    >

      <input
        name="name"
        placeholder="City"
        required
      />

      <input
        name="country"
        placeholder="Country"
        required
      />

      <button type="submit">
        Add city
      </button>

    </form>

    <button id="showCitiesButton">Load cities</button>

    <script src="client.js"></script>
  </body>
</html>
